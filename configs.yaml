defaults:

  seed: 0
  logdir: ./logdir/
  tensorboard: False
  record_video: False

  run:  
    prefill: 400
    prefill_policy: backup
    num_frames: 1000
    post_hoc_frames: 4000
    train_ratio: 64
    log_every: 200
    logger_window_size: 100

  env:
    env_id: cartpole
    reward_id: rew_v1
    max_episode_steps: 200
    obs_noise: 1e-6

  shield:
    lookahead: 20
    sigma_coef: 3.82
    num_samples: 10
    
  gp:
    learning_rate: 0.01
    num_optim_iters: 100
    batch_size: 64
    buffer_size: 1000
    sparse: False
    collapsed: False
    num_inducing_inputs: 500

  ac:
    actor: {n_units: 64, log_std_init: 0.0}
    actor_opt: {opt: adam, learning_rate: 3e-4, max_grad_norm: 0.5, eps: 1e-5}
    buffer: {size: 1000, alpha: 0.6, beta_start: 0.4, beta_frames: 200, type: default, n_bins: 32}

    num_posterior_samples: 5
    num_particles: 32
    rollout_steps: 16
    truncate_unsafe: False
    penalize_unsafe: False
    penalty_coef: 1.0
    num_optim_iters: 10
    prefill_optim_iters: 10
    normalize_obs: False
    normalize_adv: False
    
    ent_coef: 0.05

    critic_scales: {extr: 1.0, intr: 0.0}

    extr:
      critic: {n_units: 64}
      critic_opt: {opt: adam, learning_rate: 1e-3, max_grad_norm: 0.5, eps: 1e-5}
      retnorm: {impl: perc_ema, decay: 0.01, max: 1e8, perclo: 5, perchi: 95, eps: 0.0}
      gamma: 0.99
      gae_lambda: 0.95
      polyak_tau: 0.02
      slow_reg_coef: 1.0
      
    intr:
      critic: {n_units: 64}
      critic_opt: {opt: adam, learning_rate: 1e-3, max_grad_norm: 0.5, eps: 1e-5}
      retnorm: {impl: perc_ema, decay: 0.01, max: 1e8, perclo: 5, perchi: 95, eps: 0.0}
      gamma: 0.99
      gae_lambda: 0.95
      polyak_tau: 0.02
      slow_reg_coef: 1.0

