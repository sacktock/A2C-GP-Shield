[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-shield"
version = "0.1.0"
description = "Safe reinforcement learning via recovery-based shielding with Gaussian Process dynamics models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium[mujoco]>=1.3.0",
  "numpy>=1.26.4",
  "scipy>=1.14",
  "jax>=0.7.0",
  "jaxlib>=0.7.0",
  "gpjax==1.0.0",
  "numpyro>=0.21.0",
  "tensorflow>=2.20.0",
  "tensorboard>=2.17.1",
  "optax>=0.1.9",
  "flax>=0.9.0",
  "tqdm>=4.66.5",
  "ruamel.yaml>=0.18.0,<0.20.0",
  "pygame>=2.6.1",
]

[project.scripts]
gpshield = "gpshield.run:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gpshield", "gpshield.*"]

[dependency-groups]
dev = ["pytest>=9.0.3"]
cuda12 = ["jax[cuda12]>=0.7.0"]
cuda13 = ["jax[cuda13]>=0.7.0"]

[tool.uv]
conflicts = [[{ group = "cuda12" }, { group = "cuda13" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
